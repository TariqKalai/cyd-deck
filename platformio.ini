; CYD Deck - Stream Deck Bluetooth pour ESP32-2432S028R ("Cheap Yellow Display")
;
;   pio run -e cyd_ili9341 -t upload     CYD a 1 port USB (ecran ILI9341)
;   pio run -e cyd_st7789  -t upload     CYD a 2 ports USB (ecran ST7789)
;   pio device monitor                   console serie
;
; Apres le premier flash USB, mise a jour par Wi-Fi :
;   pio run -e ota -t upload

[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 2 x 1.9 Mo pour l'application (OTA confortable) + petit LittleFS
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
; genere web/firmware/<env>.bin pour le flasheur web
extra_scripts = post:tools/merge_bin.py
lib_deps =
  h2zero/NimBLE-Arduino@~1.4.3
  wakwak-koba/ESP32-NimBLE-Keyboard
  bodmer/TFT_eSPI@^2.5.31
  lvgl/lvgl@~8.3.11
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  ; TFT_eSPI est configure ici : pas de User_Setup.h a modifier
  -D USER_SETUP_LOADED=1
  -D USE_HSPI_PORT
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD=1

; CYD a 1 port USB : ILI9341
[env:cyd_ili9341]
build_flags =
  ${env.build_flags}
  -D ILI9341_2_DRIVER
  ; si le rouge et le bleu sont inverses, decommente la ligne suivante
  ; -D TFT_RGB_ORDER=TFT_BGR

; CYD a 2 ports USB : ST7789 (necessite l'inversion materielle des couleurs)
[env:cyd_st7789]
build_flags =
  ${env.build_flags}
  -D ST7789_DRIVER
  -D TFT_INVERSION_ON

; Mise a jour par Wi-Fi (ArduinoOTA). Le mot de passe doit etre celui de la page web.
[env:ota]
extends = env:cyd_ili9341
upload_protocol = espota
upload_port = cyd-deck.local
upload_flags =
  --auth=cyd1234
